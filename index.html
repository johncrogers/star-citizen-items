<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Items Wishlist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Items Wishlist</h1>
      <p class="meta" id="meta"></p>
    </div>
    <div class="total" id="total"></div>
  </header>

  <div class="pending" id="pending" hidden></div>

  <nav class="scope" id="scope" aria-label="Which items"></nav>

  <section class="toolbar">
    <input id="search" type="search" placeholder="Search, or filter: type:smg dps>=150 weight:heavy is:buyable…" autocomplete="off" spellcheck="false">
    <button type="button" id="filtersToggle" class="ghost filters-toggle" aria-expanded="false" aria-controls="filterPanel">Filters</button>
    <div class="chips" id="categoryChips"></div>
    <select id="availability" aria-label="Availability">
      <option value="">Any availability</option>
      <option value="buy">Sold in shops</option>
      <option value="loot">Loot only</option>
      <option value="craft">Crafted only</option>
      <option value="event">Event reward</option>
      <option value="none">No known source</option>
    </select>
    <select id="owned" aria-label="Owned">
      <option value="">Wanted &amp; owned</option>
      <option value="wanted">Not owned yet</option>
      <option value="owned">Owned</option>
    </select>
    <select id="sort" aria-label="Sort">
      <option value="list">List order</option>
      <option value="price-asc">Price: low → high</option>
      <option value="price-desc">Price: high → low</option>
      <option value="name">Name</option>
      <option value="manufacturer">Manufacturer</option>
      <option value="stat:dps">DPS: highest first</option>
      <option value="stat:alpha">Damage per shot: highest first</option>
      <option value="stat:rpm">Fire rate: fastest first</option>
      <option value="stat:range">Effective range: longest first</option>
      <option value="stat:mag">Magazine: biggest first</option>
      <option value="stat:dr">Damage reduction: highest first</option>
      <option value="stat:storage">Storage: most first</option>
      <option value="statlow:tempmin">Cold rating: coldest first</option>
      <option value="stat:tempmax">Heat rating: hottest first</option>
      <option value="stat:rad">Radiation protection: most first</option>
      <option value="statlow:mass">Mass: lightest first</option>
    </select>
  </section>

  <section class="filter-panel" id="filterPanel" hidden></section>
  <div class="active-filters" id="activeFilters"></div>

  <main class="layout">
    <ul class="list" id="list"></ul>
    <article class="detail" id="detail"></article>
  </main>

  <script src="site.js"></script>
  <script src="catalog.data.js"></script>
  <script src="items.data.js"></script>
  <script src="wishlist.js"></script>
  <script src="owned.js"></script>
  <script src="common.js"></script>
  <script src="filters.js"></script>
  <script src="app.js"></script>
</body>
</html>
